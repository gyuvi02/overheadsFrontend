<div class="login-container">
  <form class="login-form" (ngSubmit)="onLogin()">
    <div class="form-group">
      <label for="username" i18n="@@loginUsername">Username</label>
      <div class="input-container">
        <input
          type="text"
          id="username"
          name="username"
          [(ngModel)]="username"
          i18n-placeholder="@@loginUsernamePlaceholder"
          placeholder="Enter your username"
          step="1"
          required
        >
      </div>
    </div>

    <div class="form-group">
      <label for="password" i18n="@@loginPassword">Password</label>
      <div class="input-container">
        <input
          type="password"
          id="password"
          name="password"
          [(ngModel)]="password"
          i18n-placeholder="@@loginPasswordPlaceholder"
          placeholder="Enter your password"
          step="1"
          required
        >
      </div>
    </div>

    <div class="button-container">
      <button appButton type="submit" style="background-color: darkgreen;" [disabled]="isLoading" [class.disabled]="isLoading">
        <span *ngIf="!isLoading" i18n="@@loginButton">Login</span>
        <span *ngIf="isLoading" i18n="@@loadingPleaseWait">Please wait...</span>
        <span ngProjectAs="icon">→</span>
      </button>
    </div>
  </form>
</div>
